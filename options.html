<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuminaHub Options</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="options-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-area">
            <img class="logo-img" src="icons/icon48.png" alt="LuminaHub" />
            <h2>Lumina<span>Hub</span></h2>
          </div>
          <button id="add-btn" class="primary-btn">Add Web</button>
        </div>
        <ul id="web-list" class="web-list"></ul>
        <div class="sidebar-footer">
          <div id="sync-profile" class="sync-profile hidden">
            <div class="sync-profile-card">
              <div class="user-avatar-wrapper">
                <img id="user-avatar" class="user-avatar" src="" alt="User Avatar" />
                <span class="status-indicator"></span>
              </div>
              <div class="user-info">
                <span id="user-name">User Name</span>
                <div class="sync-meta">
                  <span id="sync-status">Synced</span>
                  <span id="last-sync-time"></span>
                </div>
              </div>
            </div>
            <div class="sync-profile-actions">
              <button id="manual-sync-btn" class="sync-action-btn sync-now-btn" title="Sync now">
                <svg viewBox="0 0 24 24" width="12" height="12"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>
                Sync Now
              </button>
              <button id="logout-btn" class="sync-action-btn sign-out-btn" title="Sign out">
                <svg viewBox="0 0 24 24" width="12" height="12"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="currentColor"/></svg>
                Sign Out
              </button>
            </div>
          </div>
          <button id="login-btn" class="sync-btn hidden">
            <svg class="google-icon" viewBox="0 0 24 24" width="16" height="16">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Sign in with Google</span>
          </button>
        </div>
      </aside>
      <main class="main-panel">

        <div id="editor-view" class="editor-view hidden">
          <div class="panel-header">
            <h3 id="panel-title">Edit Website</h3>
            <button id="delete-btn" class="danger-btn">Delete</button>
          </div>
          <div class="form-group">
            <label for="web-name">Name</label>
            <input type="text" id="web-name" placeholder="e.g., ChatGPT" />
          </div>
          <div class="form-group">
            <label for="web-url">URL</label>
            <input type="url" id="web-url" placeholder="https://chatgpt.com" />
          </div>
          <div class="form-group">
            <label>Zoom Level</label>
            <div class="zoom-controls">
              <button type="button" id="zoom-out-btn" class="zoom-btn">-</button>
              <span id="zoom-val">100%</span>
              <button type="button" id="zoom-in-btn" class="zoom-btn">+</button>
            </div>
          </div>
          <div class="form-group flex-group">
            <div class="code-editor-wrapper">
              <div class="editor-header">
                <label>Custom JS</label>
                <div style="display: flex; align-items: center;">
                  <select id="js-snippets-select" class="snippet-select">
                    <option value="" disabled selected>Snippets</option>
                    <option value="autofocus">Auto-focus Input</option>
                    <option value="autoclick">Auto Click Button</option>
                    <option value="darkmode">Dark Mode Helper</option>
                    <option value="scroll">Scroll to Bottom</option>
                  </select>
                  <button type="button" id="format-js-btn" class="format-btn">Format</button>
                </div>
              </div>
              <div id="web-js" class="code-editor-container"></div>
            </div>
            <div class="code-editor-wrapper">
              <div class="editor-header">
                <label>Custom CSS</label>
                <button type="button" id="format-css-btn" class="format-btn">Format</button>
              </div>
              <div id="web-css" class="code-editor-container"></div>
            </div>
          </div>
          <div class="actions">
            <button id="save-btn" class="primary-btn">Save Changes</button>
          </div>
        </div>
        <div id="empty-view" class="empty-view">
          <p>Select a website from the sidebar to customize or add a new one.</p>
        </div>
      </main>
    <div class="sync-setup-overlay hidden" id="sync-setup-overlay">
      <div class="sync-setup-modal">
        <h3>Google Drive Sync Setup</h3>
        <p>
          Please upload your Google Cloud credentials JSON file (e.g. <code>client_secret_*.json</code>) to enable backup and sync.
        </p>
        <div class="sync-setup-actions">
          <input type="file" id="input-sync-credentials" accept=".json" style="display: none;" />
          <button class="primary-btn" id="btn-upload-sync-json" style="flex: 1;">Choose File</button>
          <button class="secondary-btn" id="btn-cancel-sync-setup">Cancel</button>
        </div>
      </div>
    </div>
    <script src="ace.js"></script>
    <script src="ext-language_tools.js"></script>
    <script src="ext-beautify.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
